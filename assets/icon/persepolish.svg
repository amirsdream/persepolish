<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- App dark-navy background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E2A4A"/>
      <stop offset="100%" stop-color="#0F1A35"/>
    </linearGradient>

    <!-- Polish red gradient -->
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8192C"/>
      <stop offset="100%" stop-color="#C0001E"/>
    </linearGradient>

    <!-- White/silver gradient for top band -->
    <linearGradient id="whiteGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F0F0"/>
    </linearGradient>

    <!-- Gold shimmer for crown/arch accent -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>

    <!-- Glow filter for the eagle -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip rounded-square shape -->
    <clipPath id="appIcon">
      <rect width="512" height="512" rx="114" ry="114"/>
    </clipPath>
  </defs>

  <!-- ── Rounded-square background ─────────────────────────────────────── -->
  <rect width="512" height="512" rx="114" ry="114" fill="url(#bgGrad)"/>

  <!-- ── Polish flag band: white top half, red bottom half ─────────────── -->
  <!-- White band (slightly translucent so navy shows through edges) -->
  <rect x="60" y="60" width="392" height="196" rx="20" ry="20"
        fill="url(#whiteGrad)" opacity="0.95"/>
  <!-- Red band -->
  <rect x="60" y="256" width="392" height="196" rx="20" ry="20"
        fill="url(#redGrad)" opacity="0.95"/>
  <!-- Thin dividing line between bands for sharpness -->
  <rect x="60" y="252" width="392" height="8" fill="#C0001E" opacity="0.6"/>

  <!-- ── Stylized Polish Eagle (simplified, white on red / navy outline) ── -->
  <!-- Eagle body — white silhouette centered on the flag -->
  <g filter="url(#glow)" transform="translate(256,248)">
    <!-- Body oval -->
    <ellipse cx="0" cy="0" rx="54" ry="68" fill="white" opacity="0.97"/>

    <!-- Left wing — sweeping upward -->
    <path d="M-54,-20
             C-120,-60 -160,-30 -140,20
             C-120,60  -80,50  -54,10
             Z"
          fill="white" opacity="0.97"/>

    <!-- Right wing — sweeping upward (mirrored) -->
    <path d="M54,-20
             C120,-60 160,-30 140,20
             C120,60   80,50  54,10
             Z"
          fill="white" opacity="0.97"/>

    <!-- Left wing secondary feather detail -->
    <path d="M-54,0
             C-100,-20 -130,0 -110,30
             C-90,50  -70,40  -54,20
             Z"
          fill="#F0F0F0" opacity="0.5"/>

    <!-- Right wing secondary feather detail -->
    <path d="M54,0
             C100,-20 130,0 110,30
             C90,50   70,40  54,20
             Z"
          fill="#F0F0F0" opacity="0.5"/>

    <!-- Tail feathers (pointing down) -->
    <path d="M-24,68 L0,100 L24,68 Z"
          fill="white" opacity="0.97"/>
    <path d="M-40,62 L-30,92 L-10,72 Z"
          fill="white" opacity="0.85"/>
    <path d="M40,62 L30,92 L10,72 Z"
          fill="white" opacity="0.85"/>

    <!-- Eagle head (small circle at top) -->
    <circle cx="0" cy="-72" r="28" fill="white" opacity="0.97"/>

    <!-- Beak (small gold triangle) -->
    <polygon points="0,-52 12,-44 0,-38" fill="url(#goldGrad)"/>

    <!-- Eye (dark dot) -->
    <circle cx="8" cy="-76" r="5" fill="#0F1A35"/>
    <circle cx="9" cy="-77" r="2" fill="white" opacity="0.8"/>

    <!-- Crown above the eagle head (Polish royal eagle has a crown) -->
    <!-- Crown base -->
    <rect x="-22" y="-110" width="44" height="14" rx="3"
          fill="url(#goldGrad)"/>
    <!-- Crown points -->
    <polygon points="-18,-110 -14,-126 -10,-110" fill="url(#goldGrad)"/>
    <polygon points="-4,-110  0,-130  4,-110"  fill="url(#goldGrad)"/>
    <polygon points="10,-110  14,-126 18,-110"  fill="url(#goldGrad)"/>
    <!-- Crown gems -->
    <circle cx="-14" cy="-118" r="3" fill="#E8192C"/>
    <circle cx="0"   cy="-122" r="3" fill="#E8192C"/>
    <circle cx="14"  cy="-118" r="3" fill="#E8192C"/>
    <!-- Crown base line -->
    <rect x="-22" y="-96" width="44" height="6" rx="2"
          fill="url(#goldGrad)" opacity="0.7"/>

    <!-- Eagle talons / legs -->
    <path d="M-18,68 L-22,90 M-22,90 L-30,100 M-22,90 L-14,100 M-22,90 L-22,100"
          stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M18,68 L22,90 M22,90 L30,100 M22,90 L14,100 M22,90 L22,100"
          stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- ── Persian arch accent (subtle decorative element) ───────────────── -->
  <!-- A thin pointed arch at the very bottom, evoking Persian iwan motif -->
  <path d="M 196 452
           Q 256 380  316 452"
        stroke="url(#goldGrad)" stroke-width="3.5"
        fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- Small gold dots flanking the arch (decorative) -->
  <circle cx="196" cy="452" r="5" fill="url(#goldGrad)" opacity="0.7"/>
  <circle cx="316" cy="452" r="5" fill="url(#goldGrad)" opacity="0.7"/>
  <circle cx="256" cy="392" r="4" fill="url(#goldGrad)" opacity="0.6"/>

  <!-- ── "PP" lettermark in the red band ───────────────────────────────── -->
  <!-- Small "PersePolish" initial mark, white, bottom-right corner of red zone -->
  <text x="390" y="430"
        font-family="Georgia, serif"
        font-size="36"
        font-weight="bold"
        fill="white"
        opacity="0.45"
        text-anchor="middle">PP</text>

  <!-- ── Thin gold border ring ─────────────────────────────────────────── -->
  <rect x="60" y="60" width="392" height="392" rx="20" ry="20"
        fill="none"
        stroke="url(#goldGrad)"
        stroke-width="2.5"
        opacity="0.4"/>

  <!-- ── Outer rounded-square border (matches the clip) ────────────────── -->
  <rect x="3" y="3" width="506" height="506" rx="112" ry="112"
        fill="none"
        stroke="url(#goldGrad)"
        stroke-width="4"
        opacity="0.25"/>
</svg>
