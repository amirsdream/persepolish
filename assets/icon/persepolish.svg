<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1A2540"/>
      <stop offset="100%" stop-color="#0C1526"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#E81A2C"/>
      <stop offset="100%" stop-color="#B8001A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#E6A800"/>
    </linearGradient>
    <linearGradient id="wing-l" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E8E8"/>
    </linearGradient>
    <linearGradient id="wing-r" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E8E8"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow-gold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── App-icon background (dark navy, rounded square) ── -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- ── Heraldic shield (Polish coat-of-arms style) ──────
       Classic heater shield: vertical sides + pointed bottom.
       Sits on a subtle inner shadow ring so it "pops".       -->
  <g filter="url(#shadow)">
    <path d="M 256 432
             L 104 355
             L 104 108
             Q 104  88  124  88
             L 388  88
             Q 408  88  408 108
             L 408 355
             Z"
          fill="url(#shield)"/>
  </g>

  <!-- Thin inner highlight on shield top edge -->
  <path d="M 128 90 L 384 90 Q 406 90 406 112 L 406 118
           Q 404 96 384 96 L 128 96 Q 106 96 106 118 L 106 112
           Q 106 90 128 90 Z"
        fill="white" opacity="0.12"/>

  <!-- ══════════════════════════════════════════════════════
       WHITE EAGLE — Polish Orzeł Biały
       All parts are white; gold for crown, beak, talons.
       Eagle faces RIGHT (heraldic convention).
       ══════════════════════════════════════════════════════ -->

  <!-- ── LEFT WING ─────────────────────────────────────────
       Sweeps upward and to the left.
       Leading edge: upper curve from body shoulder out to tip.
       Trailing edge: lower curve back.
       Tip region is at roughly (108, 148).                  -->
  <path d="
    M 218 268
    C 198 244, 158 202, 116 166
    C  98 152,  90 135, 100 122
    C 110 110, 132 116, 156 132
    C 188 153, 212 218, 220 265
    Z"
        fill="url(#wing-l)"/>

  <!-- Wing primary feather separation lines (subtle) -->
  <path d="M 175 200 C 155 178, 128 155, 110 140"
        stroke="#C8C8C8" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M 196 226 C 178 206, 152 182, 134 164"
        stroke="#C8C8C8" stroke-width="1.5" fill="none" opacity="0.4" stroke-linecap="round"/>

  <!-- ── RIGHT WING (mirror of left around x=256) ──────── -->
  <path d="
    M 294 268
    C 314 244, 354 202, 396 166
    C 414 152, 422 135, 412 122
    C 402 110, 380 116, 356 132
    C 324 153, 300 218, 292 265
    Z"
        fill="url(#wing-r)"/>

  <!-- Wing primary feather lines right -->
  <path d="M 337 200 C 357 178, 384 155, 402 140"
        stroke="#C8C8C8" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M 316 226 C 334 206, 360 182, 378 164"
        stroke="#C8C8C8" stroke-width="1.5" fill="none" opacity="0.4" stroke-linecap="round"/>

  <!-- ── BODY ──────────────────────────────────────────────
       Narrow vertical ellipse joining head to tail.         -->
  <ellipse cx="256" cy="296" rx="40" ry="76" fill="white"/>

  <!-- ── HEAD ─────────────────────────────────────────────── -->
  <circle cx="256" cy="188" r="34" fill="white"/>

  <!-- Neck connector (fills gap between head and body) -->
  <rect x="236" y="208" width="40" height="26" rx="6" fill="white"/>

  <!-- ── TAIL FEATHERS ──────────────────────────────────────
       Fan of five feathers fanning downward below body.    -->
  <path d="
    M 220 366
    C 205 384, 196 406, 208 418
    L 228 402
    L 256 418
    L 284 402
    C 316 406, 307 384, 292 366
    Z"
        fill="white"/>

  <!-- Centre tail feather spine -->
  <path d="M 256 370 L 256 414"
        stroke="#E0E0E0" stroke-width="2" fill="none" opacity="0.6"/>
  <!-- Outer left tail line -->
  <path d="M 230 368 C 220 384, 212 400, 214 414"
        stroke="#E0E0E0" stroke-width="1.5" fill="none" opacity="0.5"/>
  <!-- Outer right tail line -->
  <path d="M 282 368 C 292 384, 300 400, 298 414"
        stroke="#E0E0E0" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- ══════════════════════════════════════════════════════
       GOLD DETAILS
       ══════════════════════════════════════════════════════ -->

  <!-- ── CROWN ──────────────────────────────────────────────
       Three-point royal crown with red ruby gems.
       Sits above head circle (head top at y=154).          -->
  <g filter="url(#glow-gold)">
    <!-- Crown band base -->
    <rect x="226" y="148" width="60" height="14" rx="4" fill="url(#gold)"/>

    <!-- Left tooth -->
    <polygon points="232,148  238,124  246,148" fill="url(#gold)"/>
    <!-- Centre tooth (tallest) -->
    <polygon points="248,148  256,116  264,148" fill="url(#gold)"/>
    <!-- Right tooth -->
    <polygon points="266,148  274,124  280,148" fill="url(#gold)"/>

    <!-- Ruby gems inside teeth -->
    <circle cx="239" cy="135" r="4.5" fill="#B8001A"/>
    <circle cx="239" cy="135" r="2"   fill="#FF4060" opacity="0.7"/>
    <circle cx="256" cy="128" r="4.5" fill="#B8001A"/>
    <circle cx="256" cy="128" r="2"   fill="#FF4060" opacity="0.7"/>
    <circle cx="273" cy="135" r="4.5" fill="#B8001A"/>
    <circle cx="273" cy="135" r="2"   fill="#FF4060" opacity="0.7"/>

    <!-- Small pearls on crown band -->
    <circle cx="240" cy="155" r="3" fill="white" opacity="0.8"/>
    <circle cx="256" cy="155" r="3" fill="white" opacity="0.8"/>
    <circle cx="272" cy="155" r="3" fill="white" opacity="0.8"/>
  </g>

  <!-- ── BEAK (pointing right — heraldic eagle faces right) -->
  <polygon points="278,190  306,198  278,208" fill="url(#gold)"/>

  <!-- ── EYE ────────────────────────────────────────────────
       Dark iris + white highlight                           -->
  <circle cx="270" cy="184" r="7"   fill="#0C1526"/>
  <circle cx="272" cy="182" r="2.5" fill="white" opacity="0.85"/>

  <!-- ── TALONS ─────────────────────────────────────────────
       Simple gold leg + three-claw spread                   -->
  <!-- Left leg -->
  <line x1="237" y1="366" x2="228" y2="392" stroke="url(#gold)" stroke-width="5"  stroke-linecap="round"/>
  <line x1="228" y1="392" x2="214" y2="410" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="228" y1="392" x2="226" y2="414" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="228" y1="392" x2="242" y2="412" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Right leg -->
  <line x1="275" y1="366" x2="284" y2="392" stroke="url(#gold)" stroke-width="5"  stroke-linecap="round"/>
  <line x1="284" y1="392" x2="298" y2="410" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="284" y1="392" x2="286" y2="414" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="284" y1="392" x2="270" y2="412" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- ══════════════════════════════════════════════════════
       FINISHING TOUCHES
       ══════════════════════════════════════════════════════ -->

  <!-- Gold outline on shield -->
  <path d="M 256 432 L 104 355 L 104 108 Q 104 88 124 88 L 388 88
           Q 408 88 408 108 L 408 355 Z"
        fill="none" stroke="url(#gold)" stroke-width="3.5" opacity="0.55"/>

  <!-- Thin white line at shield top corners (highlight) -->
  <path d="M 130 90 L 382 90" stroke="white" stroke-width="1.5" opacity="0.25"
        stroke-linecap="round"/>

  <!-- Outer icon border (very subtle gold ring) -->
  <rect x="5" y="5" width="502" height="502" rx="110"
        fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.18"/>
</svg>
