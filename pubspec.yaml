name: lingualeap
description: Polish language learning app (A1–B2) — Duolingo-style with gamification and exam prep.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Local persistence (SQLite ORM)
  drift: ^2.18.0
  drift_flutter: ^0.2.0

  # Animations
  flutter_animate: ^4.5.0
  lottie: ^3.1.0

  # Audio
  just_audio: ^0.9.39

  # Fonts
  google_fonts: ^6.2.1

  # Markdown rendering
  flutter_markdown: ^0.7.4

  # Utilities
  intl: ^0.20.0
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.3
  go_router_builder: ^2.7.0

  # Testing
  mocktail: ^1.0.4

  # Linting
  flutter_lints: ^4.0.0

  # Icon generation
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon_flat.png"
  min_sdk_android: 21
  web:
    generate: false

flutter:
  uses-material-design: true

  generate: true

  assets:
    - assets/icon/
    - assets/content/

    # A1
    - assets/content/a1/
    - assets/content/a1/grammar/
    - assets/content/a1/vocabulary/
    - assets/content/a1/exam/

    # A2
    - assets/content/a2/
    - assets/content/a2/grammar/
    - assets/content/a2/vocabulary/
    - assets/content/a2/exam/

    # B1
    - assets/content/b1/
    - assets/content/b1/grammar/
    - assets/content/b1/vocabulary/

  # Audio assets are loaded lazily — do not bundle here; use just_audio AssetAudioSource

dependencies_overrides: {}
